name: Publish tagged release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build and test tools
        run: python -m pip install -e ".[dev]"
      - name: Verify release tag matches pyproject version
        shell: pwsh
        run: |
          $v = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:GITHUB_REF_NAME -cne "v$v") { throw 'Tag does not match pyproject.toml version' }
      - name: Run tests and offline demo
        run: |
          python -m pytest -q
          python -m itmo_local demo
      - name: Build safe Windows ZIP
        shell: pwsh
        run: python tools/build_release.py --output "dist/itmo-calendar-local-$env:GITHUB_REF_NAME-windows.zip"
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Generate SHA256 checksums
        run: python tools/make_checksums.py --directory dist
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 4) { throw 'Expected ZIP, wheel, sdist, and checksums' }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "ITMO Calendar Local $env:GITHUB_REF_NAME"
